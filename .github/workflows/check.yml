name: the old door reaches the worlds

on:
  push:
    branches: [main]
  pull_request:

jobs:
  redirect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Serve the actual Pages files, then execute their redirect script for
      # every former tab. The worlds and engines are checked at their owners.
      - run: node check-redirect.js
