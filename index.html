<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The playground has moved</title>
  <meta id="redirect" http-equiv="refresh" content="3; url=https://danielswift1992.github.io/gate/playground/">
  <link id="canonical" rel="canonical" href="https://danielswift1992.github.io/gate/playground/">
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { max-width: 42rem; margin: 12vh auto; padding: 0 1.5rem; line-height: 1.6; }
    h1 { line-height: 1.2; }
    ul { display: flex; flex-wrap: wrap; gap: .5rem 1.5rem; padding: 0; list-style: none; }
    a { color: LinkText; text-underline-offset: .18em; }
  </style>
</head>
<body>
  <main>
    <h1>The playground has moved</h1>
    <p>The worlds now live beside their kit in showcase. Gate builds their editor, courts and drawings.</p>
    <p><a id="destination" href="https://danielswift1992.github.io/gate/playground/">Continue to the playground →</a></p>
    <nav aria-label="Worlds">
      <ul>
        <li><a href="https://danielswift1992.github.io/gate/playground/readme/">Read me</a></li>
        <li><a href="https://danielswift1992.github.io/gate/playground/organization/">The organization</a></li>
        <li><a href="https://danielswift1992.github.io/gate/playground/scale/">At scale</a></li>
        <li><a href="https://danielswift1992.github.io/gate/playground/basics/">Basics</a></li>
        <li><a href="https://danielswift1992.github.io/gate/playground/writer/">Typewriter</a></li>
        <li><a href="https://danielswift1992.github.io/gate/playground/buttons/">Buttons</a></li>
        <li><a href="https://danielswift1992.github.io/gate/playground/light/">Light</a></li>
        <li><a href="https://danielswift1992.github.io/gate/playground/atom/">Atom</a></li>
        <li><a href="https://danielswift1992.github.io/gate/playground/rules/">Rules</a></li>
        <li><a href="https://danielswift1992.github.io/gate/playground/faq/">FAQ</a></li>
      </ul>
    </nav>
  </main>
  <script>
  (() => {
    // 400b667 selected the first tab without URL routing. Accept the tab IDs
    // from its Manifest as explicit links, and keep every destination fixed.
    const home = "https://danielswift1992.github.io/gate/playground/";
    const worlds = {
      readme: "readme/", organization: "organization/", scale: "scale/",
      basics: "basics/", writer: "writer/", buttons: "buttons/",
      light: "light/", atom: "atom/", rules: "rules/", faq: "faq/"
    };
    const query = new URLSearchParams(window.location.search).get("tab");
    let fragment;
    try { fragment = decodeURIComponent(window.location.hash.slice(1)); }
    catch (_) { fragment = ""; }
    const hash = fragment.startsWith("tab=")
      ? new URLSearchParams(fragment).get("tab") : fragment;
    const id = [query, hash].find(value => Object.prototype.hasOwnProperty.call(worlds, value));
    const target = home + (id ? worlds[id] : "");
    document.getElementById("canonical").href = target;
    document.getElementById("destination").href = target;
    document.getElementById("redirect").content = "0; url=" + target;
    window.location.replace(target);
  })();
  </script>
</body>
</html>
